type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: binary_sensor.i4_edrive40_verbindungsstatus
        state_not: "on"
    card:
      type: picture-elements
      image: /local/images/bmw-i4-sideview-white.png
      card_mod:
        style:
          hui-image$: |
            img {
              margin: auto;
              padding: 10% 0;
            }
      elements:
        - type: state-icon
          entity: device_tracker.i4_edrive40
          state_color: false
          style:
            top: 9%
            left: 16%
        - type: state-label
          entity: device_tracker.i4_edrive40
          style:
            top: 18%
            left: 16%
        - type: state-icon
          entity: binary_sensor.i4_edrive40_zustand_der_turverriegelung
          state_color: true
          style:
            top: 9%
            left: 38%
        - type: state-label
          entity: binary_sensor.i4_edrive40_zustand_der_turverriegelung
          style:
            top: 18%
            left: 38%
        - type: state-icon
          entity: binary_sensor.i4_edrive40_deckel
          style:
            top: 9%
            left: 62%
        - type: state-label
          entity: binary_sensor.i4_edrive40_deckel
          style:
            top: 18%
            left: 62%
        - type: state-icon
          entity: binary_sensor.i4_edrive40_fenster
          style:
            top: 9%
            left: 84%
        - type: state-label
          entity: binary_sensor.i4_edrive40_fenster
          style:
            top: 18%
            left: 84%
        - type: state-icon
          entity: sensor.i4_edrive40_verbleibende_batterie_in_prozent
          style:
            top: 84%
            left: 16%
        - type: state-label
          entity: sensor.i4_edrive40_verbleibende_batterie_in_prozent
          style:
            top: 93%
            left: 16%
        - type: state-icon
          entity: sensor.i4_edrive40_verbleibende_reichweite_insgesamt
          state_color: true
          style:
            top: 84%
            left: 38%
        - type: state-label
          entity: sensor.i4_edrive40_verbleibende_reichweite_insgesamt
          style:
            top: 93%
            left: 38%
        - type: state-icon
          entity: sensor.i4_edrive40_kilometerstand
          state_color: true
          style:
            top: 84%
            left: 62%
        - type: state-label
          entity: sensor.i4_edrive40_kilometerstand
          style:
            top: 93%
            left: 62%
        - type: state-icon
          entity: switch.i4_edrive40_klimatisierung
          state_color: true
          style:
            top: 84%
            left: 84%
        - type: state-label
          entity: switch.i4_edrive40_klimatisierung
          style:
            top: 93%
            left: 84%
  - type: conditional
    conditions:
      - entity: binary_sensor.i4_edrive40_verbindungsstatus
        state: "on"
    card:
      type: picture-elements
      image: /local/images/bmw-i4-sideview-white.png
      card_mod:
        style:
          hui-image$: |
            img {
              margin: auto;
              padding: 10% 0;
            }
      elements:
        - type: state-icon
          entity: sensor.i4_edrive40_ladeziel
          state_color: false
          style:
            top: 9%
            left: 16%
        - type: state-label
          entity: sensor.i4_edrive40_ladeziel
          suffix: " Ziel"
          style:
            top: 18%
            left: 16%
        - type: state-icon
          entity: sensor.i4_edrive40_charging_time_elapsed
          style:
            top: 9%
            left: 38%
        - type: state-label
          entity: sensor.i4_edrive40_charging_time_elapsed_formatted
          suffix: " vergangen"
          style:
            top: 18%
            left: 38%
        - type: state-icon
          entity: sensor.i4_edrive40_endzeit_des_ladevorgangs
          icon: mdi:clock-end
          style:
            top: 9%
            left: 62%
        - type: state-label
          entity: sensor.i4_edrive40_charging_time_remaining_formatted
          suffix: " verbleibend"
          style:
            top: 18%
            left: 62%
        - type: conditional
          conditions:
            - entity: binary_sensor.i4_edrive40_ladestatus
              state: "off"
          elements:
            - type: state-icon
              entity: sensor.i4_edrive40_verbleibende_batterie_in_prozent
              state_color: true
              style:
                top: 9%
                left: 84%
        - type: conditional
          conditions:
            - entity: binary_sensor.i4_edrive40_ladestatus
              state: "on"
          elements:
            - type: state-icon
              entity: sensor.i4_edrive40_verbleibende_batterie_in_prozent
              icon: mdi:battery-charging
              style:
                top: 9%
                left: 84%
          card_mod:
            style:
              hui-state-icon-element$state-badge$ha-state-icon$: |
                :host {
                  color: var(--paper-item-icon-color);
                  border-radius: 16px;
                  box-shadow: 0px 0px 2px #88F1FF;
                  padding: 2px 0px 5px;
                  border: 2px solid transparent;
                  animation: pulsate 2s linear infinite;
                }
                @keyframes pulsate {
                  0% {
                    color: var(--paper-item-icon-color);
                    box-shadow: 0 0 0 transparent;
                    border: 2px solid transparent;
                  }
                  50% {
                    color: #88F1FF;
                    box-shadow: 0px 0px 8px #88F1FF;
                    border: 2px solid #88F1FF;
                  }
                  100% {
                    color:  var(--paper-item-icon-color);
                    box-shadow: 0 0 0 transparent;
                    border: 2px solid transparent;
                  }
                }
        - type: state-label
          entity: sensor.i4_edrive40_verbleibende_batterie_in_prozent
          style:
            top: 18%
            left: 84%
        - type: state-icon
          entity: select.i4_edrive40_ac_ladegrenze
          style:
            top: 84%
            left: 16%
        - type: state-label
          entity: select.i4_edrive40_ac_ladegrenze
          style:
            top: 93%
            left: 16%
        - type: state-icon
          entity: sensor.i4_edrive40_verbleibende_reichweite_insgesamt
          state_color: true
          style:
            top: 84%
            left: 38%
        - type: state-label
          entity: sensor.i4_edrive40_verbleibende_reichweite_insgesamt
          style:
            top: 93%
            left: 38%
        - type: state-icon
          entity: binary_sensor.i4_edrive40_zustand_der_turverriegelung
          state_color: true
          style:
            top: 84%
            left: 62%
        - type: state-label
          entity: binary_sensor.i4_edrive40_zustand_der_turverriegelung
          style:
            top: 93%
            left: 62%
        - type: state-icon
          entity: switch.i4_edrive40_klimatisierung
          state_color: true
          style:
            top: 84%
            left: 84%
        - type: state-label
          entity: switch.i4_edrive40_klimatisierung
          style:
            top: 93%
            left: 84%
